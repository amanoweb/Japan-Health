name: Japan Health demo inquiry validation

on:
  push:
    branches: [japan-health]
  pull_request:
    branches: [japan-health]

jobs:
  demo-inquiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate core and demo JavaScript syntax
        run: |
          node --check app.js
          node --check api/lead.js
          node --check demo-app.js
          node --check demo-polish.js
          node --check demo-inquiry.js
      - name: Verify end-to-end product invariants
        run: |
          grep -Fq '<link rel="stylesheet" href="/styles.css"' index.html
          grep -Fq '<script src="/app.js"></script>' index.html
          grep -Fq 'fetch("/api/lead"' app.js
          grep -Fq 'VALIDATION MVP' index.html
          grep -Fq 'Demo provider records are not real recommendations' index.html
          grep -Fq 'Demo provider records are not real recommendations' demo.html
          grep -Fq '/demo-inquiry.js' demo-polish.js
          grep -Fq 'JAPAN HEALTH INQUIRY' demo-inquiry.js
          grep -Fq 'fetch("/api/lead"' demo-inquiry.js
          grep -Fq 'partnerRoute:"ameca"' demo-inquiry.js
          grep -Fq 'No live downstream partner was contacted' demo-inquiry.js
          grep -Fq 'Review inquiry form' demo-inquiry.js
