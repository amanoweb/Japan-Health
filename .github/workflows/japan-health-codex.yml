name: Japan Health Codex Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: japan-health-codex
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Check API key
        id: gate
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Automation installed but inactive: add repository secret OPENAI_API_KEY to enable Codex runs."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out Japan Health branch
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: japan-health
          fetch-depth: 0

      - name: Run Codex improvement
        if: steps.gate.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bots: true
          prompt-file: AUTONOMOUS_IMPROVEMENT.md
          effort: medium

      - name: Validate and commit safe changes
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check api/lead.js
          grep -q '/styles.css' index.html
          grep -q '/app.js' index.html
          grep -q '/api/lead' app.js
          grep -qi 'illustrative\|demo' index.html

          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no safe, meaningful changes."
            exit 0
          fi

          git config user.name "japan-health-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "chore(japan-health): autonomous Codex improvement"
          git push origin HEAD:japan-health
