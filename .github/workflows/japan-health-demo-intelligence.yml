name: Japan Health demo intelligence

on:
  push:
    branches: [japan-health]
  pull_request:
    branches: [japan-health]

jobs:
  validate-demo-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required JavaScript
        run: |
          node --check app.js
          node --check api/lead.js
          node --check demo-app.js
          node --check demo-polish.js
          node --check demo-continuity.js
          node --check demo-access-guard.js
          node --check demo-access-score.js
          node --check demo-evidence-intelligence.js
          node --check demo-decision-transparency.js
          node --check demo-handoff-readiness.js
          node --check demo-handoff-summary.js
          node --check demo-scenarios.js
          node --check demo-inquiry.js
          node --check demo-journey-guidance.js
          node --check demo-mobile-comparison.js
      - name: Verify production and demo invariants
        run: |
          grep -Fq '<link rel="stylesheet" href="/styles.css"' index.html
          grep -Fq '<script src="/app.js"></script>' index.html
          grep -Fq 'fetch("/api/lead"' app.js
          grep -Fq 'VALIDATION MVP' index.html
          grep -Fq 'does not diagnose' index.html
          grep -Fq 'Demo provider records are not real recommendations' index.html
          grep -Fq 'Demo provider records are not real recommendations' demo.html
          grep -Fq 'for(const [src,key] of modules)await loadModule(src,key)' demo-polish.js
          grep -Fq 'aria-pressed' demo-polish.js
          grep -Fq '/demo-evidence-intelligence.js' demo-polish.js
          grep -Fq '/demo-decision-transparency.js' demo-polish.js
          grep -Fq '/demo-handoff-readiness.js' demo-polish.js
          grep -Fq '/demo-journey-guidance.js' demo-polish.js
          grep -Fq '/demo-mobile-comparison.js' demo-polish.js
          grep -Fq 'SEARCHED EXPERTISE EVIDENCE' demo-evidence-intelligence.js
          grep -Fq 'Provider-wide specialties are not silently promoted' demo-evidence-intelligence.js
          grep -Fq 'APPLIED CONSTRAINTS' demo-decision-transparency.js
          grep -Fq 'Hard filters are separated from access-score ordering' demo-decision-transparency.js
          grep -Fq 'TOTAL-COST VISIBILITY' demo-decision-transparency.js
          grep -Fq 'OPEN VERIFICATION CHECKLIST' demo-decision-transparency.js
          grep -Fq 'AMECA remains only a downstream placeholder' demo-decision-transparency.js
          grep -Fq 'ACCESS AT A GLANCE' demo-journey-guidance.js
          grep -Fq 'Access logistics only — not clinical quality.' demo-journey-guidance.js
          grep -Fq 'NEXT ACTION' demo-journey-guidance.js
          grep -Fq 'ACCESS SCORE' demo-mobile-comparison.js
          grep -Fq 'BOOKING READINESS' demo-mobile-comparison.js
          grep -Fq 'TOTAL-COST DATA' demo-mobile-comparison.js
          grep -Fq 'Show access evidence' demo-mobile-comparison.js
          grep -Fq 'Open access profile' demo-mobile-comparison.js
          grep -Fq 'aria-expanded' demo-mobile-comparison.js
          grep -Fq 'HANDOFF READINESS PACKET' demo-handoff-readiness.js
          grep -Fq 'Structured logistics context only' demo-handoff-readiness.js
          grep -Fq 'AMECA remains only a downstream placeholder' demo-inquiry.js
          grep -Fq 'accessSnapshot:accessSnapshot(p)' demo-inquiry.js
          grep -Fq 'area:s.area' demo-inquiry.js
          grep -Fq 'dataset.submitting' demo-inquiry.js
          grep -Fq 'fetch("/api/lead"' demo-inquiry.js
