name: Japan Health demo intelligence

on:
  push:
    branches: [japan-health]
  pull_request:
    branches: [japan-health]

jobs:
  validate-demo-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required JavaScript
        run: |
          node --check app.js
          node --check api/lead.js
          node --check demo-app.js
          node --check demo-polish.js
          node --check demo-access-score.js
          node --check demo-evidence-intelligence.js
          node --check demo-handoff-readiness.js
          node --check demo-handoff-summary.js
          node --check demo-inquiry.js
      - name: Verify production and demo invariants
        run: |
          grep -Fq '<link rel="stylesheet" href="/styles.css"' index.html
          grep -Fq '<script src="/app.js"></script>' index.html
          grep -Fq 'fetch("/api/lead"' app.js
          grep -Fq 'VALIDATION MVP' index.html
          grep -Fq 'does not diagnose' index.html
          grep -Fq 'Demo provider records are not real recommendations' index.html
          grep -Fq 'Demo provider records are not real recommendations' demo.html
          grep -Fq '/demo-evidence-intelligence.js' demo-polish.js
          grep -Fq '/demo-handoff-readiness.js' demo-polish.js
          grep -Fq 'SEARCHED EXPERTISE EVIDENCE' demo-evidence-intelligence.js
          grep -Fq 'Provider-wide specialties are not silently promoted' demo-evidence-intelligence.js
          grep -Fq 'HANDOFF READINESS PACKET' demo-handoff-readiness.js
          grep -Fq 'Structured logistics context only' demo-handoff-readiness.js
          grep -Fq 'AMECA remains only a downstream placeholder' demo-inquiry.js
          grep -Fq 'fetch("/api/lead"' demo-inquiry.js
