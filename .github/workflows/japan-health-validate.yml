name: Japan Health validation

on:
  push:
    branches: [main, japan-health]
  pull_request:
    branches: [main, japan-health]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check api/lead.js
          node --check api/providers.js
          node --check trust-controls.js
          node --check access-confidence.js
          node --check directory-intelligence.js
          node --check cost-intelligence.js
          node --check lead-review.js
          node --check specialist-access.js
          node --check specialist-handoff.js
          node --check data/providers.js
          node --check data/tokyo-english-directory.js
          node --check data/tokyo-verified-clinics.js
          node --check data/drive-provider-handoff.js
          node --check data/provider-promotions-2026-09-05.js
          node --check data/provider-promotions-batch-2.js
          node --check data/provider-promotions-batch-3.js
          node --check data/provider-promotions-batch-4.js
          node --check data/provider-promotions-batch-5.js
          node --check data/provider-promotions-batch-6.js
          node --check data/provider-promotions-batch-7.js
          node --check data/provider-promotions-batch-8.js
          node --check data/provider-promotions-batch-9.js
          node --check data/provider-promotions-batch-10.js
          node --check scripts/validate-provider-data.js
          node --check scripts/validate-provider-api.js
          node --check scripts/validate-drive-provider-handoff.js
          node --check scripts/validate-lead-contract.js
          node --check scripts/validate-expertise-contract.js
          node --check scripts/report-specialty-coverage.js
          if [ -f api/health.js ]; then node --check api/health.js; fi
      - name: Validate provider data safety
        run: node scripts/validate-provider-data.js
      - name: Validate provider API fallback
        run: node scripts/validate-provider-api.js
      - name: Validate Drive provider handoff completeness
        run: node scripts/validate-drive-provider-handoff.js
      - name: Validate typed expertise evidence
        run: node scripts/validate-expertise-contract.js
      - name: Validate lead handoff contract
        run: node scripts/validate-lead-contract.js
      - name: Report Tokyo specialty coverage
        run: |
          node scripts/report-specialty-coverage.js || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "${code}"; fi
      - name: Verify production invariants
        run: |
          grep -Fq '<link rel="stylesheet" href="/styles.css"' index.html
          grep -Fq '<link rel="stylesheet" href="/trust-controls.css"' index.html
          grep -Fq '<script src="/data/providers.js"></script>' index.html
          grep -Fq '<script src="/data/tokyo-english-directory.js"></script>' index.html
          grep -Fq '<script src="/data/tokyo-verified-clinics.js"></script>' index.html
          grep -Fq '<script src="/api/providers?format=js"></script>' index.html
          grep -Fq '<script src="/app.js"></script>' index.html
          grep -Fq '<script src="/trust-controls.js"></script>' index.html
          grep -Fq '<script src="/access-confidence.js"></script>' index.html
          grep -Fq '<script src="/cost-intelligence.js"></script>' index.html
          grep -Fq '<script src="/lead-review.js"></script>' index.html
          grep -Fq '<script src="/cost-intelligence.js"></script>' clinics.html
          grep -Fq '<script src="/specialist-access.js"></script>' clinics.html
          grep -Fq '<script src="/specialist-handoff.js"></script>' clinics.html
          grep -Fq 'SEARCHED EXPERTISE + SERVICE ACCESS' specialist-access.js
          grep -Fq 'SERVICE-LEVEL CONFIRMED' specialist-access.js
          grep -Fq 'PROVIDER-LEVEL ONLY' specialist-access.js
          grep -Fq 'SPECIALIST HANDOFF CONTEXT' specialist-handoff.js
          grep -Fq 'source-backed expertise evidence' clinics.html
          grep -Fq 'fetch("/api/lead"' app.js
          grep -Fq 'VALIDATION MVP' index.html
          grep -Fq 'does not diagnose' index.html
          grep -Fq 'Demo provider records are not real recommendations' index.html
          grep -Fq 'partnerRoute:"ameca"' app.js
          grep -Fq 'AMECA_LEAD_WEBHOOK_URL' api/lead.js
          grep -Fq 'costSnapshot:sanitizeCostSnapshot' api/lead.js
          grep -Fq 'specialistAccessSnapshot:sanitizeSpecialistAccessSnapshot' api/lead.js
          grep -Fq 'service-language-verification' api/lead.js
          grep -Fq 'Cost-readiness context only' api/lead.js
          grep -Fq 'SUPABASE_SERVICE_ROLE_KEY' api/providers.js
          grep -Fq 'Show official-source checked records only' index.html
          grep -Fq 'value="medical-travel"' index.html
          grep -Fq 'journey:major-medical-travel' api/lead.js
          grep -Fq 'ACCESS DATA COVERAGE' trust-controls.js
          grep -Fq 'TOTAL-COST VISIBILITY' trust-controls.js
          grep -Fq 'aria-live' trust-controls.js
          grep -Fq 'International Access Score is a logistics-friction summary' trust-controls.js
          grep -Fq 'journey-audience-context' trust-controls.js
          grep -Fq 'setJourneyAudience' trust-controls.js
          grep -Fq 'syncLeadAudience' trust-controls.js
