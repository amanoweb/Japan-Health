name: Japan Health validation

on:
  push:
    branches: [main, japan-health]
  pull_request:
    branches: [main, japan-health]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check api/lead.js
          node --check api/providers.js
          node --check home-search.js
          node --check home-product-polish.js
          node --check home-search-state.js
          node --check trust-controls.js
          node --check access-confidence.js
          node --check directory-intelligence.js
          node --check cost-intelligence.js
          node --check lead-review.js
          node --check specialist-access.js
          node --check service-booking-filters.js
          node --check booking-readiness.js
          node --check specialist-handoff.js
          node --check data/providers.js
          node --check data/provider-service-access-batch-2026-09-05.js
          node --check scripts/validate-provider-data.js
          node --check scripts/validate-provider-api.js
          node --check scripts/validate-drive-provider-handoff.js
          node --check scripts/validate-lead-contract.js
          node --check scripts/validate-expertise-contract.js
          node --check scripts/validate-service-access-promotions.js
          node --check scripts/validate-specialty-service-access-batch.js
      - name: Validate provider data safety
        run: node scripts/validate-provider-data.js
      - name: Validate provider API fallback
        run: node scripts/validate-provider-api.js
      - name: Validate service-level access promotions
        run: node scripts/validate-service-access-promotions.js
      - name: Validate specialty service-access batch
        run: node scripts/validate-specialty-service-access-batch.js
      - name: Validate Drive provider handoff completeness
        run: node scripts/validate-drive-provider-handoff.js
      - name: Validate typed expertise evidence
        run: node scripts/validate-expertise-contract.js
      - name: Validate lead handoff contract
        run: node scripts/validate-lead-contract.js
      - name: Verify production invariants
        run: |
          grep -Fq '<link rel="stylesheet" href="/styles.css"' index.html
          grep -Fq 'href="/app.js"' index.html
          ! grep -Fq '<script src="/app.js"></script>' index.html
          grep -Fq '<script src="/home-search.js"></script>' index.html
          grep -Fq '<script src="/home-product-polish.js"></script>' index.html
          grep -Fq '<script src="/home-search-state.js"></script>' index.html
          grep -Fq '<script src="/data/providers.js"></script>' index.html
          grep -Fq '<script src="/data/provider-service-access-batch-2026-09-05.js"></script>' index.html
          ! grep -Fq '/api/providers?format=js' index.html
          ! grep -Fq '/data/tokyo-english-directory.js' index.html
          ! grep -Fq '/trust-controls.js' index.html
          grep -Fq 'What do you need help with?' index.html
          grep -Fq 'Tokyo area' index.html
          grep -Fq 'Visitor or resident' index.html
          grep -Fq 'No clinical-quality ranking' index.html
          grep -Fq 'does not silently relax' index.html
          grep -Fq 'Symptoms are routed to broad care categories' index.html
          grep -Fq 'Fever / everyday illness' index.html
          grep -Fq 'International Access Score uses communication 40%' index.html
          grep -Fq 'Prefer service-level evidence when available' index.html
          grep -Fq 'Provider-level support is not silently promoted' index.html
          grep -Fq 'function constraintMatch' home-search.js
          grep -Fq 'function matchedEvidence' home-search.js
          grep -Fq 'function serviceAccess' home-search.js
          grep -Fq "sa.level==='service'" home-search.js
          grep -Fq 'Source-backed disease/service evidence' home-search.js
          grep -Fq 'Service-level language evidence' home-search.js
          grep -Fq 'Provider-level only:' home-search.js
          grep -Fq 'requested-service communication route' home-search.js
          grep -Fq 'TOP ACCESS-EVIDENCE MATCH' home-search.js
          grep -Fq 'Neither is a clinical-quality ranking.' home-search.js
          grep -Fq "s.area&&!areaMatches(p,s.area)" home-search.js
          grep -Fq "id:'general-care'" home-search.js
          grep -Fq "terms:['fever','temperature','cold','flu'" home-search.js
          grep -Fq "target:['internal medicine','general practice','primary care','general medicine']" home-search.js
          grep -Fq 'We interpreted this as' home-search.js
          grep -Fq 'No documented match for all selected constraints.' home-search.js
          grep -Fq 'Search all Tokyo instead' home-search.js
          grep -Fq 'International Access Score uses communication 40%' home-search.js
          grep -Fq 'Open verification gaps:' home-search.js
          grep -Fq '/home-product-polish.js' home-search.js
          grep -Fq '__JAPAN_HEALTH_HOME_PRODUCT_POLISH__' home-product-polish.js
          grep -Fq "['ginza','Chuo']" home-product-polish.js
          grep -Fq "['roppongi','Minato']" home-product-polish.js
          grep -Fq 'BOOKING READINESS' home-product-polish.js
          grep -Fq 'access rules documented' home-product-polish.js
          grep -Fq 'Next access step:' home-product-polish.js
          grep -Fq "fetch('/api/lead'" home-product-polish.js
          grep -Fq 'Official-source checked only' home-search-state.js
          grep -Fq 'Copy search link' home-search-state.js
          grep -Fq "params.set('verified','1')" home-search-state.js
          grep -Fq 'No official-source checked result satisfies the current search.' home-search-state.js
          grep -Fq 'VALIDATION MVP' index.html
          grep -Fq 'does not diagnose' index.html
          grep -Fq 'Demo provider records are not real recommendations' index.html
          grep -Fq 'fetch("/api/lead"' app.js
          grep -Fq 'partnerRoute:"ameca"' app.js
          grep -Fq 'AMECA_LEAD_WEBHOOK_URL' api/lead.js
          grep -Fq 'SEARCHED EXPERTISE + SERVICE ACCESS' specialist-access.js
          grep -Fq 'BOOKING READINESS' booking-readiness.js
          grep -Fq 'TOTAL-COST VISIBILITY' trust-controls.js
